[package]
name = "ddj-game"
version = "0.1.1"
edition = "2024"

[dependencies]
ddj-extract = { version = "0.1.0", path = "../extract" }
ddj-rules = { version = "0.1.0", path = "../rules" }
eframe = "0.37.0"
percent-encoding = "2.3.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
rustysynth = "1.3.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
web-time = "1.1.0"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(not(any(windows, target_arch = "wasm32")))'.dependencies]
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "wasm-bindgen"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["console", "Document", "HtmlCanvasElement", "Window"] }

[build-dependencies]
winresource = "0.1.34"
