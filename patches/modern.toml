# The remake's rebalance layer, applied on top of the imported original tables.
# Every value here is a first-pass placeholder to tune during play-testing.
# Player patches (any other .toml in this folder) override these key by key.

[xp]
# Each level's own cost is the original's divided by a divisor: divisor_early up to
# ease_from, falling linearly to divisor_late at ease_to (docs/balance.md).
divisor_early = 2.5
divisor_late = 1.5
ease_from = 60
ease_to = 70
# Extra XP per floor below floor 1: floor 10 pays 1 + 9 * 0.15 = 2.35x.
depth_bonus_per_floor = 0.15
# Bonus for party members below the party's highest level, per level behind.
catchup_per_level_behind = 0.10
catchup_cap = 1.0

[spells]
# Multiplier on the original max-SP gain per level.
max_sp_mult = 2.5
# Fraction of max SP restored per dungeon step (resting in town still refills).
regen_per_step = 0.005

[loot]
# Drop weight of SP-restoring potions relative to healing potions.
sp_potion_vs_heal = 0.85

[combat]
# Seconds per combat round; the player can pause.
round_seconds = 2.0
# Chance to hit = A / (A + defense) with A = attack x hit_bias, clamped to 5-95%.
hit_bias = 1.0
# Attack and defense a guild level adds, per point of the guild's fighting ability
# (Warrior 1.2, Nomad 0.7, casters 0.5).
ad_per_fighting = 3.0
# A character's damage: 1 to (weapon power x weapon_die) + (STR - 10) / 2, times the
# weapon's damage multiplier. Bare hands count as power 2.
weapon_die = 6
# A monster's damage: 1 to (level x monster_die + attack / 20).
monster_die = 2
# A kill is worth hp x level x xp_per_hp_level + attack / 2 XP, before depth bonuses.
xp_per_hp_level = 1.5
# Gold per monster: level x gold_min to level x gold_max.
gold_min = 5
gold_max = 25
# Chance a cleared group leaves an item found on this floor or shallower.
item_chance = 0.15

[boxes]
# Chance a chest is magically locked, by floor (1-based); the last value repeats.
magic_lock_chance = [0.01, 0.01, 0.015, 0.02, 0.025, 0.08, 0.12, 0.16, 0.20, 0.25]
